<style>
:root{--navy:#07131f;--mint:#19c6b3;--blue:#2f7cff;--text:#14202b;--muted:#687684;--line:#e5ebf0;--soft:#f5f8fb;--white:#fff;--shadow:0 18px 50px rgba(6,24,43,.1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--text);background:var(--soft);line-height:1.65}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 40px));margin:auto}.topbar{background:#05101a;color:#d8e5ef;font-size:13px}.topbar .container{min-height:38px;display:flex;justify-content:space-between;align-items:center}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900}.call{padding:13px 18px;border-radius:13px;background:var(--navy);color:#fff;font-weight:900}.hero{padding:74px 0 52px;background:linear-gradient(135deg,#07131f,#0f2940);color:#fff}.eyebrow{display:inline-flex;background:#e8fbf8;color:#087b70;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:900}.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.12;letter-spacing:-.05em;margin:18px 0 16px}.hero p{max-width:720px;color:#c7d5df;font-size:17px}.main{padding:58px 0 90px}.tools{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:24px}.search{flex:1;min-width:240px;border:1px solid #d8e1e8;border-radius:13px;padding:14px 16px;font:inherit}.filter{border:1px solid #d8e1e8;background:#fff;border-radius:13px;padding:12px 17px;font-weight:900;cursor:pointer}.filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}.count{color:var(--muted);font-size:14px;margin:14px 0 22px}.group{margin-top:34px}.group h2{font-size:28px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-weight:850;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(6,24,43,.09);border-color:#bfd6e8}.badge{font-size:12px;color:#0a7d70;background:#e8fbf8;border-radius:999px;padding:5px 8px;white-space:nowrap}.empty{display:none;background:#fff;border:1px solid var(--line);padding:30px;border-radius:18px;text-align:center;color:var(--muted)}footer{background:#06111b;color:#aabac7;padding:40px 0 80px}.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.mobile{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.container{width:min(100% - 28px,1180px)}.topbar .container span:last-child{display:none}.grid{grid-template-columns:1fr}.hero{padding:56px 0 42px}.call{display:none}.mobile{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:linear-gradient(135deg,var(--mint),var(--blue));color:#fff;text-align:center;padding:15px;border-radius:14px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.2)}}
</style>
</head>
<body>
<div class="topbar"><div class="container"><span><strong>24시간 상담</strong> · 전국 지역 상담 가능</span><span>배관 내시경 · 고압세척 · 막힘 제거</span></div></div>
<header><div class="container nav"><a class="brand" href="/">수리남케어</a><a class="call" href="tel:01076011156">전화상담 010-7601-1156</a></div></header>
<section class="hero"><div class="container"><span class="eyebrow">전체 작업지역</span><h1>지역별 배관 서비스를<br>한곳에서 확인하세요.</h1><p>사이트맵에 등록된 하수구막힘, 싱크대막힘, 변기막힘 내부 페이지를 서비스별로 정리했습니다. 지역명이나 서비스명을 검색해 바로 이동할 수 있습니다.</p></div></section>
<main class="main"><div class="container">
<div class="tools"><input id="q" class="search" type="search" placeholder="예: 강서구, 수원, 창원, 싱크대막힘"><button class="filter active" data-type="all">전체</button><button class="filter" data-type="sink">싱크대</button><button class="filter" data-type="drain">하수구</button><button class="filter" data-type="toilet">변기</button></div>
<div id="count" class="count">지역 페이지를 불러오는 중입니다.</div>
<div id="groups"></div><div id="empty" class="empty">검색 결과가 없습니다.</div>
</div></main>
<footer><div class="container footer-inner"><div><strong>수리남케어</strong><br>전국 하수구·싱크대·변기 막힘 상담</div><div>24시간 전화상담 010-7601-1156</div></div></footer>
<a class="mobile" href="tel:01076011156">전화상담 010-7601-1156</a>
<script>
const regionMap={anyang:'안양',bucheon:'부천',bupyeong:'부평',changwon:'창원',cheoin:'용인 처인구',cheongwon:'청주 청원구',daedeok:'대전 대덕구',dalseo:'대구 달서구',danwon:'안산 단원구',deogyang:'고양 덕양구',deokjin:'전주 덕진구',dobong:'서울 도봉구',dongan:'안양 동안구',dongdaemun:'서울 동대문구',dongjak:'서울 동작구',dongnae:'부산 동래구',dongnam:'천안 동남구',eunpyeong:'서울 은평구',gangbuk:'서울 강북구',gangdong:'서울 강동구',gangnam:'서울 강남구',gangseo:'서울 강서구',geumcheon:'서울 금천구',geumjeong:'부산 금정구',gimhae:'김해',guro:'서울 구로구',gwanak:'서울 관악구',gwangjin:'서울 광진구',haeundae:'부산 해운대구',incheon:'인천',jinhae:'진해',jongno:'서울 종로구',jungnang:'서울 중랑구',masan:'마산',mapo:'서울 마포구',namdong:'인천 남동구',nowon:'서울 노원구',osan:'오산',paju:'파주',seodaemun:'서울 서대문구',seocho:'서울 서초구',seongbuk:'서울 성북구',seongsan:'창원 성산구',songpa:'서울 송파구',suwon:'수원',uichang:'창원 의창구',ulsan:'울산',yeongdeungpo:'서울 영등포구',yeonsu:'인천 연수구',yongin:'용인',busan:'부산',daegu:'대구',daejeon:'대전',gwangju:'광주',cheongju:'청주',cheonan:'천안',jeonju:'전주',gunpo:'군포',gwangmyeong:'광명',namyangju:'남양주',uijeongbu:'의정부',seongnam:'성남',bundang:'성남 분당구',dongtan:'화성 동탄'};
const serviceMap={sink:'싱크대막힘',drain:'하수구막힘',toilet:'변기막힘'};
let pages=[],active='all';
const typeOf=u=>u.includes('-sink.')?'sink':u.includes('-toilet.')?'toilet':u.includes('-drain.')?'drain':'other';
function labelOf(path){const file=decodeURIComponent(path.split('/').pop()||'').replace(/\.html?$/i,'');const type=typeOf(path);const slug=file.replace(/-(sink|drain|toilet)$/,'');const region=regionMap[slug]||slug.split('-').map(x=>regionMap[x]||x).join(' ');return region+(serviceMap[type]||'');}
function render(){const q=document.querySelector('#q').value.trim().toLowerCase();const filtered=pages.filter(p=>(active==='all'||p.type===active)&&(!q||(p.label+' '+p.url).toLowerCase().includes(q)));const grouped={sink:[],drain:[],toilet:[]};filtered.forEach(p=>grouped[p.type]?.push(p));const host=document.querySelector('#groups');host.innerHTML=['sink','drain','toilet'].filter(t=>grouped[t].length).map(t=>`<section class="group"><h2>${serviceMap[t]}</h2><div class="grid">${grouped[t].map(p=>`<a class="card" href="${p.url}"><span>${p.label}</span><span class="badge">바로가기</span></a>`).join('')}</div></section>`).join('');document.querySelector('#count').textContent=`현재 ${filtered.length}개 페이지 · 전체 ${pages.length}개`;document.querySelector('#empty').style.display=filtered.length?'none':'block'}
fetch('/sitemap.xml',{cache:'no-store'}).then(r=>r.text()).then(text=>{const xml=new DOMParser().parseFromString(text,'application/xml');const seen=new Set();pages=[...xml.querySelectorAll('loc')].map(n=>n.textContent.trim()).filter(u=>/-(sink|drain|toilet)\.html?(?:$|\?)/i.test(u)).map(u=>{const url=new URL(u,location.origin).pathname.replace(/^\//,'');return{url,label:labelOf(url),type:typeOf(url)}}).filter(p=>!seen.has(p.url)&&seen.add(p.url)).sort((a,b)=>a.label.localeCompare(b.label,'ko'));render()}).catch(()=>{pages=[{url:'gangseo-sink.html',label:'서울 강서구싱크대막힘',type:'sink'},{url:'gangseo-drain.html',label:'서울 강서구하수구막힘',type:'drain'},{url:'gangseo-toilet.html',label:'서울 강서구변기막힘',type:'toilet'}];render()});
document.querySelector('#q').addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.type;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});const qs=new URLSearchParams(location.search).get('service');if(['sink','drain','toilet'].includes(qs)){active=qs;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.type===qs))}
</script>
</body></html>
